<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN — SCT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b16;color:#f7f8ff;font-family:Arial,Helvetica,sans-serif}
.wrap{width:min(1180px,100%);margin:auto;padding:18px}
h1{margin:0 0 14px;font-size:22px}
.card{background:#11162a;border:1px solid #2b3553;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 15px 45px #0006}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,button{font:inherit}
input{width:100%;background:#080c18;border:1px solid #35405f;color:#fff;border-radius:10px;padding:11px;outline:none}
button{border:0;border-radius:10px;padding:10px 13px;background:linear-gradient(135deg,#ffd45a,#ef6b2b);font-weight:900;color:#190c03;cursor:pointer}
button.secondary{background:#1a2138;color:#dce2f0;border:1px solid #35405f}
.status{padding:9px 11px;border-radius:10px;margin-top:8px;font-size:12px}
.ok{background:#0c2b1e;color:#71f1aa;border:1px solid #235f45}
.err{background:#34131c;color:#ff8da0;border:1px solid #713142}
.muted{color:#8c96b2;font-size:12px}
#app{display:none}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar input{max-width:330px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stat{background:#0b1020;border:1px solid #242e4a;border-radius:11px;padding:11px}
.stat small{display:block;color:#7f89a6;font-size:10px}.stat b{display:block;margin-top:5px;font-size:18px}
.user-list{overflow:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;min-width:980px}
th,td{padding:10px 8px;border-bottom:1px solid #252e48;text-align:left;font-size:11px;white-space:nowrap}
th{color:#ffd45a;font-size:10px;background:#0d1221;position:sticky;top:0}
td.num{text-align:right}
.badge{padding:4px 7px;border-radius:999px;background:#102b20;color:#69edaa}
.login{max-width:420px;margin:70px auto}
@media(max-width:700px){.wrap{padding:10px}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 ADMIN — CHÚA TỂ SCT</h1>

  <section class="card login" id="loginCard">
    <div class="muted">Đăng nhập bằng ADMIN_KEY trong Environment của server.</div>
    <input id="adminKey" type="password" placeholder="ADMIN_KEY" autocomplete="current-password" style="margin-top:10px">
    <button id="loginBtn" onclick="adminLogin()" style="width:100%;margin-top:9px">ĐĂNG NHẬP ADMIN</button>
    <div id="loginMsg"></div>
  </section>

  <main id="app">
    <section class="card">
      <div class="toolbar">
        <b>👥 QUẢN LÝ TÀI KHOẢN</b>
        <button class="secondary" onclick="loadUsers()">🔄 TẢI LẠI</button>
        <button class="secondary" onclick="logout()">ĐĂNG XUẤT</button>
      </div>
      <div class="toolbar" style="margin-top:10px">
        <input id="search" placeholder="Tìm theo tên tài khoản..." onkeydown="if(event.key==='Enter')loadUsers()">
        <button onclick="loadUsers()">🔎 TÌM</button>
      </div>
      <div class="summary">
        <div class="stat"><small>TỔNG TÀI KHOẢN</small><b id="totalUsers">0</b></div>
        <div class="stat"><small>TỔNG TTT</small><b id="totalTtt">0</b></div>
        <div class="stat"><small>TỔNG LƯỢT CHƠI</small><b id="totalPlays">0</b></div>
        <div class="stat"><small>TỔNG ĐÃ THẮNG</small><b id="totalWon">0</b></div>
      </div>
      <div id="usersMsg"></div>
      <div class="user-list" id="usersList"></div>
    </section>

    <section class="card">
      <b>🎁 QUẢN LÝ CODE</b>
      <p class="muted">Phần code hiện tại vẫn dùng các API admin của server.</p>
      <button onclick="window.location.href='/admin'">MỞ TRANG ADMIN CODE</button>
    </section>
  </main>
</div>

<script>
let adminKey=sessionStorage.getItem("sctAdminKey")||"";
const $=id=>document.getElementById(id);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString("vi-VN");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

async function adminFetch(path,opt={}){
  opt.headers={...(opt.headers||{}),"x-admin-key":adminKey};
  const r=await fetch(path,opt);
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||"Lỗi máy chủ");
  return d;
}
async function adminLogin(){
  const key=$("adminKey").value.trim();
  if(!key){$("loginMsg").innerHTML='<div class="status err">Nhập ADMIN_KEY.</div>';return}
  const btn=$("loginBtn");btn.disabled=true;btn.textContent="ĐANG KIỂM TRA...";
  try{
    adminKey=key;
    const d=await adminFetch("/api/admin/users?search=");
    sessionStorage.setItem("sctAdminKey",adminKey);
    $("loginCard").style.display="none";$("app").style.display="block";
    renderUsers(d.users||[]);
  }catch(e){
    $("loginMsg").innerHTML='<div class="status err">❌ '+esc(e.message)+'</div>';
  }finally{btn.disabled=false;btn.textContent="ĐĂNG NHẬP ADMIN"}
}
function renderUsers(users){
  $("totalUsers").textContent=fmt(users.length);
  $("totalTtt").textContent=fmt(users.reduce((a,u)=>a+Number(u.ttt||0),0));
  $("totalPlays").textContent=fmt(users.reduce((a,u)=>a+Number(u.plays||0),0));
  $("totalWon").textContent=fmt(users.reduce((a,u)=>a+Number(u.total_won||0),0));

  if(!users.length){
    $("usersList").innerHTML='<div class="muted">Không có tài khoản.</div>';return;
  }

  $("usersList").innerHTML=`<table>
    <thead><tr>
      <th>ID</th><th>TÀI KHOẢN</th><th>TTT</th><th>LƯỢT CHƠI</th>
      <th>THẮNG LỚN</th><th>TỔNG ĐÃ THẮNG</th><th>TẠO LÚC</th>
      <th>ĐĂNG NHẬP GẦN NHẤT</th><th>PHIÊN ĐANG HOẠT ĐỘNG</th>
    </tr></thead>
    <tbody>${users.map(u=>`<tr>
      <td>${esc(u.id)}</td>
      <td><b>${esc(u.username)}</b></td>
      <td class="num">${fmt(u.ttt)}</td>
      <td class="num">${fmt(u.plays)}</td>
      <td class="num">${fmt(u.biggest_win)}</td>
      <td class="num">${fmt(u.total_won)}</td>
      <td>${formatDate(u.created_at)}</td>
      <td>${u.last_login_at?formatDate(u.last_login_at):"Chưa đăng nhập"}</td>
      <td><span class="badge">${fmt(u.active_sessions)}</span></td>
    </tr>`).join("")}</tbody>
  </table>`;
}
function formatDate(v){if(!v)return"-";const d=new Date(v);return Number.isNaN(d.getTime())?"-":d.toLocaleString("vi-VN")}
async function loadUsers(){
  try{
    const q=encodeURIComponent($("search").value.trim());
    const d=await adminFetch("/api/admin/users?search="+q);
    renderUsers(d.users||[]);
    $("usersMsg").innerHTML='<div class="status ok">Đã tải '+fmt(d.total||0)+' tài khoản.</div>';
  }catch(e){
    $("usersMsg").innerHTML='<div class="status err">❌ '+esc(e.message)+'</div>';
    if(/ADMIN_KEY|Sai/i.test(e.message))logout();
  }
}
function logout(){
  adminKey="";sessionStorage.removeItem("sctAdminKey");
  $("app").style.display="none";$("loginCard").style.display="block";$("adminKey").value="";
}
(async()=>{
  if(!adminKey)return;
  try{
    const d=await adminFetch("/api/admin/users?search=");
    $("loginCard").style.display="none";$("app").style.display="block";renderUsers(d.users||[]);
  }catch{logout()}
})();
</script>
</body>
</html>
