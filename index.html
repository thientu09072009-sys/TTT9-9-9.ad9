<script>
const API_URL = "https://ttt9-9-9-9.onrender.com";

let adminPassword = "";

const $ = id => document.getElementById(id);

async function api(path, options = {}) {
  const headers = {
    ...(options.headers || {})
  };

  if (adminPassword) {
    headers["x-admin-password"] = adminPassword;
  }

  return fetch(API_URL + path, {
    ...options,
    headers,
    cache: "no-store"
  });
}


// ============================
// KIỂM TRA SERVER
// ============================

async function checkServer() {
  const status = $("serverStatus");

  status.className = "status info";
  status.textContent = "🔄 Đang kiểm tra server...";

  try {
    const r = await api("/api/health");

    if (!r.ok) {
      throw new Error("Server trả lỗi");
    }

    const d = await r.json();

    if (d.ok) {
      status.className = "status ok";
      status.textContent = "🟢 Server đang hoạt động";
    } else {
      throw new Error();
    }

  } catch (e) {
    status.className = "status err";
    status.textContent =
      "🔴 Không kết nối được Server Render";
  }
}


// ============================
// HIỆN / ẨN MẬT KHẨU
// ============================

function togglePass() {
  $("pass").type =
    $("pass").type === "password"
      ? "text"
      : "password";
}


// ============================
// ENTER ĐỂ ĐĂNG NHẬP
// ============================

$("pass").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    login();
  }
});


// ============================
// ĐĂNG NHẬP ADMIN
// ============================

async function login() {

  const p = $("pass").value.trim();

  if (!p) {
    $("loginMsg").innerHTML =
      '<div class="status err">❌ Vui lòng nhập mật khẩu.</div>';
    return;
  }

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "⏳ Đang đăng nhập...";

  try {

    const r = await fetch(
      API_URL + "/api/codes",
      {
        headers: {
          "x-admin-password": p
        },
        cache: "no-store"
      }
    );

    const d = await r.json().catch(() => null);

    if (!r.ok) {

      $("loginMsg").innerHTML =
        `<div class="status err">
          ❌ ${d?.error || "Mật khẩu sai hoặc Server chưa chạy."}
        </div>`;

      return;
    }

    adminPassword = p;

    sessionStorage.setItem(
      "sctAdminPassword",
      p
    );

    $("loginCard").style.display = "none";
    $("app").style.display = "block";

    render(d);

  } catch (e) {

    $("loginMsg").innerHTML =
      '<div class="status err">🔴 Không kết nối được Server Render.</div>';

  } finally {

    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "🔑 ĐĂNG NHẬP";
  }
}


// ============================
// ĐĂNG XUẤT
// ============================

function logout() {

  adminPassword = "";

  sessionStorage.removeItem(
    "sctAdminPassword"
  );

  $("app").style.display = "none";
  $("loginCard").style.display = "block";

  $("pass").value = "";
  $("loginMsg").innerHTML = "";

  checkServer();
}


// ============================
// TẢI DANH SÁCH CODE
// ============================

async function loadCodes() {

  try {

    const r = await api(
      "/api/codes"
    );

    const d = await r.json().catch(() => null);

    if (!r.ok) {

      if (r.status === 401) {
        logout();
        return;
      }

      throw new Error(
        d?.error || "Không tải được code"
      );
    }

    render(d);

  } catch (e) {

    $("list").innerHTML =
      `<div class="status err">
        🔴 ${e.message || "Không tải được dữ liệu."}
      </div>`;
  }
}


// ============================
// TẠO CODE
// ============================

async function createCode() {

  const code =
    $("code").value.trim().toUpperCase();

  const reward =
    Number($("reward").value);

  const maxUses =
    Number($("maxUses").value || 0);

  const expires =
    $("expires").value
      ? new Date(
          $("expires").value
        ).toISOString()
      : null;


  if (!code) {

    $("createMsg").innerHTML =
      '<div class="status err">❌ Chưa nhập code.</div>';

    return;
  }


  if (!/^[A-Z0-9_-]{3,40}$/.test(code)) {

    $("createMsg").innerHTML =
      '<div class="status err">❌ Code phải từ 3–40 ký tự A-Z, 0-9, _ hoặc -.</div>';

    return;
  }


  if (!Number.isFinite(reward) || reward <= 0) {

    $("createMsg").innerHTML =
      '<div class="status err">❌ Số điểm không hợp lệ.</div>';

    return;
  }


  if (!Number.isInteger(maxUses) || maxUses < 0) {

    $("createMsg").innerHTML =
      '<div class="status err">❌ Số lượt sử dụng không hợp lệ.</div>';

    return;
  }


  $("createMsg").innerHTML =
    '<div class="status info">⏳ Đang tạo code...</div>';


  try {

    const r = await api(
      "/api/codes",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          code,
          reward,
          maxUses,
          expiresAt: expires
        })
      }
    );


    const d =
      await r.json().catch(() => null);


    if (!r.ok || !d?.ok) {

      $("createMsg").innerHTML =
        `<div class="status err">
          ❌ ${d?.error || "Không tạo được code."}
        </div>`;

      return;
    }


    $("createMsg").innerHTML =
      `<div class="status ok">
        ✅ Đã tạo <b>${escapeHtml(code)}</b>
        → +${reward.toLocaleString("vi-VN")} điểm
      </div>`;


    $("code").value = "";
    $("reward").value = "";
    $("maxUses").value = "0";
    $("expires").value = "";


    await loadCodes();

  } catch (e) {

    $("createMsg").innerHTML =
      '<div class="status err">🔴 Server không phản hồi.</div>';
  }
}


// ============================
// HIỂN THỊ CODE
// ============================

function render(data) {

  const arr =
    Array.isArray(data)
      ? data
      : Array.isArray(data?.codes)
        ? data.codes
        : [];


  if (!arr.length) {

    $("list").innerHTML =
      '<div class="muted">Chưa có code nào.</div>';

    return;
  }


  $("list").innerHTML =
    arr.map(x => {

      const exp =
        x.expiresAt
          ? new Date(
              x.expiresAt
            ).toLocaleString("vi-VN")
          : "Không hết hạn";


      return `
        <div class="code">

          <b>🎁 ${escapeHtml(x.code)}</b><br>

          💰 +${Number(
            x.reward
          ).toLocaleString("vi-VN")} điểm<br>

          🔢 ${
            x.usedCount || 0
          }/${x.maxUses || "∞"} lượt<br>

          📅 ${exp}<br>

          <span class="muted">
            ${
              x.active
                ? "🟢 ĐANG BẬT"
                : "🔴 ĐÃ TẮT"
            }
          </span>

          <div class="actions">

            <button
              onclick="toggleCode(
                '${esc(x.code)}',
                ${!x.active}
              )">
              ${x.active ? "TẮT" : "BẬT"}
            </button>

            <button
              onclick="resetCode(
                '${esc(x.code)}'
              )">
              RESET
            </button>

            <button
              onclick="deleteCode(
                '${esc(x.code)}'
              )">
              XÓA
            </button>

          </div>

        </div>
      `;

    }).join("");
}


// ============================
// BẬT / TẮT CODE
// ============================

async function toggleCode(
  code,
  active
) {

  try {

    const r = await api(
      "/api/codes/" +
      encodeURIComponent(code),
      {
        method: "PATCH",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          active
        })
      }
    );


    if (r.status === 401) {
      logout();
      return;
    }


    await loadCodes();

  } catch (e) {

    alert(
      "Không kết nối được Server."
    );
  }
}


// ============================
// RESET CODE
// ============================

async function resetCode(code) {

  if (
    !confirm(
      "Reset toàn bộ lượt sử dụng của code này?"
    )
  ) {
    return;
  }


  try {

    const r = await api(
      "/api/codes/" +
      encodeURIComponent(code),
      {
        method: "PATCH",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          resetUses: true
        })
      }
    );


    if (r.status === 401) {
      logout();
      return;
    }


    await loadCodes();

  } catch (e) {

    alert(
      "Không kết nối được Server."
    );
  }
}


// ============================
// XÓA CODE
// ============================

async function deleteCode(code) {

  if (
    !confirm(
      "Xóa code này?"
    )
  ) {
    return;
  }


  try {

    const r = await api(
      "/api/codes/" +
      encodeURIComponent(code),
      {
        method: "DELETE"
      }
    );


    if (r.status === 401) {
      logout();
      return;
    }


    await loadCodes();

  } catch (e) {

    alert(
      "Không kết nối được Server."
    );
  }
}


// ============================
// CHỐNG HTML INJECTION
// ============================

function escapeHtml(s) {

  return String(s).replace(
    /[&<>"']/g,
    m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m])
  );
}


function esc(s) {

  return String(s)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}


// ============================
// KHỞI ĐỘNG ADMIN
// ============================

(async function init() {

  await checkServer();

  const saved =
    sessionStorage.getItem(
      "sctAdminPassword"
    );


  if (!saved) return;


  $("pass").value = saved;
  adminPassword = saved;


  try {

    const r = await api(
      "/api/codes"
    );


    if (!r.ok) {
      sessionStorage.removeItem(
        "sctAdminPassword"
      );
      adminPassword = "";
      return;
    }


    const d =
      await r.json();


    $("loginCard").style.display =
      "none";

    $("app").style.display =
      "block";

    render(d);

  } catch (e) {

    console.log(
      "Chưa kết nối được Server:",
      e
    );
  }

})();
</script>
