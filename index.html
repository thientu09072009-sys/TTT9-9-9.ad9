<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN — CHÚA TỂ SCT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100616;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:auto;padding:15px}
h1{color:#ffd34e;text-align:center}
.card{background:#211027;border:1px solid #71305f;border-radius:14px;padding:14px;margin:10px 0}
input,button{width:100%;padding:12px;margin:5px 0;border-radius:9px;border:0;font-size:15px}
input{background:#120812;color:#fff;border:1px solid #714765}
button{background:#63305e;color:#fff;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.2)}
button:active{transform:translateY(1px)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.status{padding:9px;border-radius:8px;text-align:center;font-size:13px;margin:6px 0}
.ok{background:#163d20;color:#9affaa}
.err{background:#45151b;color:#ff9b9b}
.info{background:#252035;color:#d9c8e1}
.code{border-top:1px solid #44233e;padding:12px 0}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.actions button{font-size:12px;padding:9px}
.muted{color:#c7afc5;font-size:12px}
#app{display:none}
.eye{position:relative}
.eye input{padding-right:55px}
.eye button{position:absolute;right:5px;top:5px;width:auto;padding:8px 10px;background:#39203d}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px}
.badge.on{background:#163d20;color:#9affaa}
.badge.off{background:#45151b;color:#ff9b9b}
.footer{text-align:center;color:#8d6b87;font-size:12px;padding:18px}
@media(max-width:480px){
  .row,.actions{grid-template-columns:1fr}
  .wrap{padding:9px}
}
</style>
</head>
<body>
<div class="wrap">
<h1>🔐 ADMIN — CHÚA TỂ SCT</h1>

<div id="loginCard" class="card">
  <div id="serverStatus" class="status info">🔄 Đang kiểm tra Render server...</div>

  <div class="eye">
    <input id="pass" type="password" autocomplete="current-password" placeholder="Mật khẩu Admin">
    <button type="button" onclick="togglePass()">👁️</button>
  </div>

  <button type="button" id="loginBtn" onclick="login()">🔑 ĐĂNG NHẬP ADMIN</button>
  <div id="loginMsg"></div>
  <div class="muted">Có thể nhấn Enter trong ô mật khẩu để đăng nhập.</div>
</div>

<div id="app">
  <div class="card">
    <div class="status ok">✅ Đã kết nối Render server</div>
    <button type="button" onclick="logout()">🚪 ĐĂNG XUẤT</button>
  </div>

  <div class="card">
    <h3>➕ Tạo code điểm ảo</h3>
    <input id="code" maxlength="40" placeholder="Ví dụ: TTT100K">
    <input id="reward" type="number" min="1" placeholder="Số điểm thưởng">
    <input id="maxUses" type="number" min="0" value="0" placeholder="Lượt tối đa (0 = không giới hạn)">
    <input id="expires" type="datetime-local">
    <button type="button" onclick="createCode()">➕ TẠO CODE</button>
    <div id="createMsg"></div>
  </div>

  <div class="card">
    <h3>📋 Quản lý code</h3>
    <button type="button" onclick="loadCodes()">🔄 TẢI LẠI DANH SÁCH</button>
    <div id="list"><div class="muted">Chưa tải danh sách.</div></div>
  </div>
</div>

<div class="footer">CHÚA TỂ SCT • ADMIN SYSTEM</div>
</div>

<script>
const API_URL = "https://ttt9-9-9-9.onrender.com";
let adminKey = "";

const $ = id => document.getElementById(id);

function apiHeaders(extra = {}) {
  return Object.assign({"x-admin-key": adminKey}, extra);
}

async function readJson(response) {
  return await response.json().catch(() => ({}));
}

async function checkServer() {
  try {
    const r = await fetch(API_URL + "/health", {cache:"no-store"});
    const d = await readJson(r);

    if (!r.ok) throw new Error(d.error || "HTTP " + r.status);

    $("serverStatus").className = "status ok";
    $("serverStatus").textContent = "🟢 Render server đang hoạt động";
    return true;
  } catch (e) {
    console.error("health:", e);
    $("serverStatus").className = "status err";
    $("serverStatus").textContent = "🔴 Không kết nối được Render server";
    return false;
  }
}

function togglePass() {
  $("pass").type = $("pass").type === "password" ? "text" : "password";
}

$("pass").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    login();
  }
});

async function login() {
  const key = $("pass").value.trim();

  if (!key) {
    $("loginMsg").innerHTML =
      '<div class="status err">❌ Vui lòng nhập ADMIN_KEY.</div>';
    return;
  }

  const button = $("loginBtn");
  button.disabled = true;
  button.textContent = "⏳ ĐANG KIỂM TRA...";

  try {
    const r = await fetch(API_URL + "/api/codes", {
      method: "GET",
      headers: {"x-admin-key": key},
      cache: "no-store"
    });

    const d = await readJson(r);

    if (!r.ok) {
      $("loginMsg").innerHTML =
        '<div class="status err">❌ ' +
        escapeHtml(d.error || "ADMIN_KEY sai hoặc server chưa cấu hình.") +
        '</div>';
      return;
    }

    adminKey = key;
    sessionStorage.setItem("sctAdminKey", key);

    $("loginCard").style.display = "none";
    $("app").style.display = "block";

    renderCodes(Array.isArray(d) ? d : (d.codes || []));
  } catch (e) {
    console.error(e);
    $("loginMsg").innerHTML =
      '<div class="status err">🔴 Không kết nối được Render API.<br><small>' +
      escapeHtml(e.message) +
      '</small></div>';
  } finally {
    button.disabled = false;
    button.textContent = "🔑 ĐĂNG NHẬP ADMIN";
  }
}

function logout() {
  adminKey = "";
  sessionStorage.removeItem("sctAdminKey");
  $("app").style.display = "none";
  $("loginCard").style.display = "block";
  $("pass").value = "";
  $("loginMsg").innerHTML = "";
  checkServer();
}

async function loadCodes() {
  $("list").innerHTML = '<div class="status info">🔄 Đang tải...</div>';

  try {
    const r = await fetch(API_URL + "/api/codes", {
      method: "GET",
      headers: apiHeaders(),
      cache: "no-store"
    });

    const d = await readJson(r);

    if (r.status === 401 || r.status === 403) {
      logout();
      $("loginMsg").innerHTML =
        '<div class="status err">❌ ADMIN_KEY không hợp lệ.</div>';
      return;
    }

    if (!r.ok) throw new Error(d.error || "Không tải được danh sách code.");

    renderCodes(Array.isArray(d) ? d : (d.codes || []));
  } catch (e) {
    console.error(e);
    $("list").innerHTML =
      '<div class="status err">🔴 Không tải được dữ liệu.<br><small>' +
      escapeHtml(e.message) +
      '</small></div>';
  }
}

async function createCode() {
  const code = $("code").value.trim().toUpperCase();
  const reward = Number($("reward").value);
  const maxUses = Number($("maxUses").value || 0);
  const expiresAt = $("expires").value
    ? new Date($("expires").value).toISOString()
    : null;

  if (!code) {
    $("createMsg").innerHTML =
      '<div class="status err">❌ Chưa nhập code.</div>';
    return;
  }

  if (!Number.isFinite(reward) || reward <= 0) {
    $("createMsg").innerHTML =
      '<div class="status err">❌ Số điểm thưởng phải lớn hơn 0.</div>';
    return;
  }

  if (!Number.isFinite(maxUses) || maxUses < 0) {
    $("createMsg").innerHTML =
      '<div class="status err">❌ Số lượt sử dụng không hợp lệ.</div>';
    return;
  }

  try {
    const r = await fetch(API_URL + "/api/codes", {
      method: "POST",
      headers: apiHeaders({"Content-Type":"application/json"}),
      body: JSON.stringify({
        code,
        reward,
        maxUses,
        expiresAt
      })
    });

    const d = await readJson(r);

    if (!r.ok || d.ok === false) {
      throw new Error(d.error || "Không tạo được code.");
    }

    $("createMsg").innerHTML =
      '<div class="status ok">✅ Đã tạo code ' +
      escapeHtml(code) +
      ' — +' + reward.toLocaleString("vi-VN") +
      ' TTT</div>';

    $("code").value = "";
    $("reward").value = "";
    $("maxUses").value = "0";
    $("expires").value = "";

    await loadCodes();
  } catch (e) {
    console.error(e);
    $("createMsg").innerHTML =
      '<div class="status err">🔴 ' +
      escapeHtml(e.message) +
      '</div>';
  }
}

function renderCodes(arr) {
  if (!Array.isArray(arr) || !arr.length) {
    $("list").innerHTML =
      '<div class="muted">Chưa có code nào.</div>';
    return;
  }

  $("list").innerHTML = arr.map(x => {
    const code = String(x.code || "");
    const reward = Number(x.reward || 0);

    const used = Number(
      x.usedCount ?? x.used ?? x.uses ?? 0
    );

    const max = Number(
      x.maxUses ?? x.max_uses ?? 0
    );

    const expiresValue =
      x.expiresAt ?? x.expires_at ?? null;

    const exp = expiresValue
      ? new Date(expiresValue).toLocaleString("vi-VN")
      : "Không hết hạn";

    const active =
      x.active !== false &&
      x.active !== 0 &&
      x.active !== "false";

    return `
      <div class="code">
        <b>🎁 ${escapeHtml(code)}</b><br>
        💰 +${reward.toLocaleString("vi-VN")} TTT<br>
        🔢 ${used}/${max || "∞"} lượt<br>
        📅 ${escapeHtml(exp)}<br>
        <span class="badge ${active ? "on" : "off"}">
          ${active ? "🟢 ĐANG BẬT" : "🔴 ĐÃ TẮT"}
        </span>

        <div class="actions">
          <button onclick="toggleCode('${esc(code)}',${!active})">
            ${active ? "TẮT" : "BẬT"}
          </button>
          <button onclick="resetCode('${esc(code)}')">
            RESET
          </button>
          <button onclick="deleteCode('${esc(code)}')">
            XÓA
          </button>
        </div>
      </div>
    `;
  }).join("");
}

async function toggleCode(code, active) {
  try {
    const r = await fetch(
      API_URL + "/api/codes/" + encodeURIComponent(code),
      {
        method: "PATCH",
        headers: apiHeaders({"Content-Type":"application/json"}),
        body: JSON.stringify({active})
      }
    );

    const d = await readJson(r);

    if (!r.ok) {
      throw new Error(d.error || "Không cập nhật được code.");
    }

    await loadCodes();
  } catch (e) {
    alert("Không cập nhật được code:\n" + e.message);
  }
}

async function resetCode(code) {
  if (!confirm("Reset toàn bộ lượt sử dụng của code " + code + "?"))
    return;

  try {
    const r = await fetch(
      API_URL + "/api/codes/" + encodeURIComponent(code),
      {
        method: "PATCH",
        headers: apiHeaders({"Content-Type":"application/json"}),
        body: JSON.stringify({resetUses:true})
      }
    );

    const d = await readJson(r);

    if (!r.ok) {
      throw new Error(d.error || "Không reset được code.");
    }

    await loadCodes();
  } catch (e) {
    alert("Không reset được:\n" + e.message);
  }
}

async function deleteCode(code) {
  if (!confirm("XÓA VĨNH VIỄN code " + code + "?"))
    return;

  try {
    const r = await fetch(
      API_URL + "/api/codes/" + encodeURIComponent(code),
      {
        method: "DELETE",
        headers: apiHeaders()
      }
    );

    const d = await readJson(r);

    if (!r.ok) {
      throw new Error(d.error || "Không xóa được code.");
    }

    await loadCodes();
  } catch (e) {
    alert("Không xóa được:\n" + e.message);
  }
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[m]));
}

function esc(value) {
  return String(value ?? "")
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
}

(async function init() {
  await checkServer();

  const saved = sessionStorage.getItem("sctAdminKey");
  if (!saved) return;

  try {
    const r = await fetch(API_URL + "/api/codes", {
      headers: {"x-admin-key": saved},
      cache: "no-store"
    });

    const d = await readJson(r);

    if (r.ok) {
      adminKey = saved;
      $("pass").value = saved;
      $("loginCard").style.display = "none";
      $("app").style.display = "block";
      renderCodes(Array.isArray(d) ? d : (d.codes || []));
    } else {
      sessionStorage.removeItem("sctAdminKey");
    }
  } catch (e) {
    console.error("restore:", e);
  }
})();
</script>
</body>
</html>
